  seat-less workspace subscription in USD or EUR (a currency toggle switches the
  displayed prices; only the USD figures are quoted below because the EUR
  figures render client-side). Every tier is quota-bound rather than
  call-bound - the meters are tracked prompts, action briefs per month and
  AI-optimized articles per month, not API requests. MCP access is included on
  every paid tier, including the entry plan, which is unusual: the agent surface
  is not gated behind Enterprise. No overage pricing is published for any tier;
  the page states limits and stops, so exceeding a quota is not priced.
