      resolve when probed on 2026-08-13 (see lifecycle/).
  mcp:
    url: https://app.sitefire.ai/api/mcp
    transport: http
    tools: 10
    gated: true
    gate_evidence: >-
      POST tools/list returned HTTP 401 with
      WWW-Authenticate Bearer resource_metadata="https://app.sitefire.ai/api/mcp/oauth-metadata"
      on 2026-08-13. Tool inputSchemas require an authenticated introspection.
    tool_list_source: https://github.com/sitefire-ai/skills
  graphql:
    endpoint: null
    note: No GraphQL surface was found on either host.
