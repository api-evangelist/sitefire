method: derived
source: mcp/sitefire-mcp.yml + openapi/sitefire-book-demo-api-openapi.yml
notes: >-
  This crosswalk records a total divergence, and that is the finding. Sitefire
  has both an MCP server and an OpenAPI, but they describe entirely different
  products: every one of the ten MCP tools operates on AI-visibility data
  (topics, actions, briefings, articles) and neither of the two REST operations
  does - they book a sales demo. There is not a single tool-to-operation
  binding to make. crosswalk[] is therefore empty by measurement, not by
  omission: all ten tools are mcp_only and both REST operations are rest_only.
  The practical consequence is that Sitefire's real product API has no public
  REST contract at all. The MCP server IS the API, and its input schemas are
  reachable only with an authenticated tools/list - an anonymous POST returns
  401. Tool names and descriptions below are the provider's own, harvested from
  the official sitefire-ai/skills bundle; because tools/list is gated, no tool
  below carries a verified inputSchema, and none is asserted.
surfaces:
  openapi:
    file: openapi/sitefire-book-demo-api-openapi.yml
    base: https://sitefire.ai/api
    operations: 2
    gated: false
    note: >-
