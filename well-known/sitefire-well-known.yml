notes: >-
  Re-probed 2026-08-13 across both Sitefire hosts. sitefire.ai (Next.js on
  Vercel) returns a hard 404 for every /.well-known/ path. app.sitefire.ai is a
  single-page app whose catch-all answers HTTP 200 with the same 4,555-byte HTML
  shell for EVERY path, including /.well-known/agent-card.json,
  /.well-known/openid-configuration and /.well-known/oauth-protected-resource -
  those are soft 200s, not documents, and are recorded as misses. No WellKnown
  and no SecurityTxt pointer is emitted, because nothing at a /.well-known/ path
  on either host returned a real document.
  One genuine machine-readable discovery document DOES exist, but off the
  canonical path: the MCP server's RFC 9728 protected-resource metadata is
  served at https://app.sitefire.ai/api/mcp/oauth-metadata. It is captured in
  authentication/ rather than here, precisely because it is not a well-known
  URI. That is the single fix that would earn Sitefire this surface: serve the
  same JSON from /.well-known/oauth-protected-resource.
