notes: >-
  Sitefire publishes NO HTTP rate limits. There is no rate-limit section in the
  docs, the MCP page says nothing about throttling, and no RateLimit-*,
  X-RateLimit-* or Retry-After header was observed on any live response probed
  on 2026-08-13 (the MCP 401 challenge, the 405 from /api/book-demo, and the 404
  from /api/book-demo/slots all carried none). What Sitefire does publish is a
  set of hard monthly QUOTAS attached to each pricing tier, so the limits below
  are account-scoped consumption ceilings measured in product units - tracked
  prompts, action briefs, generated articles - not requests per second. They are
  the real ceiling an agent driving the MCP tools will hit: write_article is
  bounded by the articles-per-month quota and create_action by the briefs-per-
  month quota, and neither surfaces a documented error or header when exhausted.
  That gap is the finding: an agent cannot detect exhaustion from the wire.
