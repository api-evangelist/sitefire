notes: >-
  Sitefire ships no client SDK. npm, PyPI, RubyGems, crates.io, NuGet, Maven
  Central, Packagist and pkg.go.dev were all searched for a first-party Sitefire
  library and none exists - an npm registry search for "sitefire" returns zero
  packages and pypi.org/pypi/sitefire/json returns 404. The one first-party
  distributable is the Agent Skills plugin in the sitefire-ai GitHub org, which
  is not published to any package registry: it is installed straight from the
  repo default branch with `npx skills add sitefire-ai/skills`. That
  distribution is UNPINNED - the repo carries no tags and no releases, so the
  install command always resolves to whatever is on `main`, and a consumer
  cannot state which version they installed. version is therefore recorded as
  null with the repo's last-push date, which is the only dated signal available.
  No SDKs pointer is emitted in apis.yml, because a skills/MCP plugin is not a
  client library and claiming it as one would be false.
