availability_probe:
  checked: '2026-08-13'
  summary: >-
    Neither documented Book Demo operation resolved. The GET route falls through
    to the marketing site's Next.js MDX catch-all and 404s; the POST route
    reaches a serverless function that fails to invoke. The API is documented as
    live in Sitefire's own llms.txt, which still carries working curl examples
    for both calls. This is recorded as measured behaviour, not as a claim about
    intent - the surface may have been retired without the docs being updated,
    or it may be a deployment fault. The OpenAPI in openapi/ is left untouched
    and still describes what the provider documents.
  results:
  - operation: getBookDemoSlots
    request: GET https://sitefire.ai/api/book-demo/slots?date=2026-08-20&timezone=America/New_York
    http_status: 404
    content_type: text/html
    evidence: >-
      Response carried x-matched-path "/[...mdxPath]" and the Next.js
      __next_error__ document, meaning no API route is registered at this path.
    repeated: 2
  - operation: bookDemo
    request: POST https://sitefire.ai/api/book-demo
    http_status: 405
    content_type: text/plain
    body: "Method not allowed\n\nFUNCTION_INVOCATION_FAILED"
    evidence: >-
      Returned on 4 of 5 attempts, with a Vercel invocation id. One earlier
      attempt returned the same 405 as application/json with the body
      {"error": {"code": "405", "message": "Method not allowed"}}. Both shapes
      were observed within the same minute.
    repeated: 5
  - operation: bookDemo (preflight)
    request: OPTIONS https://sitefire.ai/api/book-demo
    http_status: 405
    repeated: 1
  note: >-
    robots.txt disallows /api/ for all user agents, which is a crawling
    directive rather than an access control, and does not explain a 404 or a
    function invocation failure.
