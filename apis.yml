  - https://sitefire.ai/docs/quick-start.md
  note: >-
    Upgraded from derived/unknown on 2026-08-13 after reading the published
    pricing page. Three tiers - Lite $249/mo, Pro $499/mo, Enterprise custom -
    each with a 7-day free trial, self-service signup at app.sitefire.ai, and no
    free tier. MCP access is included on every paid tier. The product API itself
    is not publicly callable - it is the account-gated MCP server - so public
    remains false.
